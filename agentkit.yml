version: 1

docs:
  root: docs
  design: docs/design.md
  workflow: docs/workflow.md
  decisions: docs/decisions

components:
  cli:
    description: AgentKit command-line interface and command routing.
    code:
      - src/agentkit/cli.py
      - src/agentkit/__main__.py
      - src/agentkit/architecture.py
      - pyproject.toml
    docs:
      - docs/components/cli/design.md
      - docs/components/cli/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - cli
      - command
      - argparse

  configuration:
    description: agentkit.yml schema and configuration parsing.
    code:
      - src/agentkit/config.py
      - src/agentkit/policy.py
      - src/agentkit/presets.py
      - agentkit.yml
      - tests/test_config.py
      - tests/test_presets.py
    docs:
      - docs/components/configuration/design.md
      - docs/components/configuration/schema.md
      - docs/components/configuration/testing.md
    required_docs:
      - design
      - schema
      - testing
    keywords:
      - config
      - schema
      - yaml

  guidance:
    description: Agent-facing orientation, intent guidance, docs-impact, and review guidance.
    code:
      - src/agentkit/commands.py
      - src/agentkit/render.py
      - src/agentkit/templates.py
      - src/agentkit/git.py
      - src/agentkit/fs.py
      - src/agentkit/maintainability.py
      - src/agentkit/codex.py
      - src/agentkit/lifecycle.py
      - src/agentkit/rules.py
      - src/agentkit/receipts.py
      - src/agentkit/task_state.py
      - src/agentkit/watch.py
      - tests/test_commands.py
      - tests/test_lifecycle_characterization.py
      - tests/test_rules.py
      - tests/test_task_state.py
    docs:
      - docs/components/guidance/design.md
      - docs/components/guidance/testing.md
      - docs/implementation-model.md
      - docs/review-guidance.md
    required_docs:
      - design
      - testing
    keywords:
      - orient
      - guidance
      - docs-impact
      - review

  docs:
    description: Product design, workflow, roadmap, and maintainability documentation.
    code:
      - docs/**
      - README.md
      - AGENTS.md
    docs:
      - docs/design.md
      - docs/workflow.md
      - docs/roadmap.md
      - docs/implementation-model.md
    required_docs:
      - design
    keywords:
      - docs
      - documentation
      - maintainability

  skill:
    description: Codex plugin packaging and bundled AgentKit skill for agents using the toolkit.
    code:
      - plugins/agentkit/**
      - .agents/plugins/marketplace.json
    docs:
      - docs/components/skill/design.md
      - docs/components/skill/testing.md
      - docs/design.md
      - docs/workflow.md
    required_docs:
      - design
      - testing
    keywords:
      - plugin
      - skill
      - marketplace
      - codex

  governance:
    description: Repository hygiene, package boundaries, and AgentKit's own dogfood baseline.
    code:
      - .gitignore
      - LICENSE
      - src/agentkit/__init__.py
    docs:
      - docs/components/governance/design.md
      - docs/components/governance/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - governance
      - repository
      - git

layers:
  config:
    paths:
      - src/agentkit/config.py
      - src/agentkit/policy.py
      - src/agentkit/presets.py
    may_import: []
  utilities:
    paths:
      - src/agentkit/fs.py
      - src/agentkit/git.py
      - src/agentkit/render.py
      - src/agentkit/templates.py
      - src/agentkit/receipts.py
      - src/agentkit/task_state.py
      - src/agentkit/architecture.py
      - src/agentkit/maintainability.py
    may_import:
      - config
  lifecycle:
    paths:
      - src/agentkit/lifecycle.py
      - src/agentkit/rules.py
      - src/agentkit/watch.py
      - src/agentkit/codex.py
    may_import:
      - config
      - utilities
  commands:
    paths:
      - src/agentkit/commands.py
    may_import:
      - config
      - utilities
      - lifecycle
  cli:
    paths:
      - src/agentkit/cli.py
      - src/agentkit/__main__.py
    may_import:
      - commands
      - lifecycle

review:
  require_for:
    - public_api
    - data_model
    - architecture
    - guidance
    - cli
  default: warn

skills:
  source: plugins/agentkit/skills/agentkit/SKILL.md
  output: plugins/agentkit/skills/agentkit/SKILL.md

maintainability:
  budgets:
    - name: commands-orchestration
      paths:
        - src/agentkit/commands.py
      max_lines: 1000
      max_functions: 45
      max_classes: 0
      mode: warn
      guidance: "commands.py should stay near command orchestration; prefer extracting Codex hook helpers or guidance rendering before adding more behavior."
    - name: focused-modules
      paths:
        - src/agentkit/config.py
        - src/agentkit/cli.py
        - src/agentkit/lifecycle.py
        - src/agentkit/maintainability.py
        - src/agentkit/templates.py
        - src/agentkit/architecture.py
        - src/agentkit/codex.py
        - src/agentkit/policy.py
        - src/agentkit/presets.py
        - src/agentkit/rules.py
        - src/agentkit/task_state.py
      max_lines: 350
      max_functions: 25
      max_classes: 8
      mode: warn
      guidance: "Keep focused modules small enough for future agents to scan in one pass."

preset:
  source: agentkit
  name: recommended-v1
  version: 1

rules:
  working_tree_clean:
    enabled: true
    severity: error
  check_receipt_current:
    enabled: true
    severity: error
  review_addressed:
    enabled: true
    severity: error
    allow_skip: true
  blocked_question_recorded:
    enabled: true
    severity: error

reminders:
  open_task: true
  ready_to_close: true
  stale_terminal: true
