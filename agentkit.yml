version: 1

docs:
  root: docs
  design: docs/design.md
  workflow: docs/workflow.md
  decisions: docs/decisions

components:
  cli:
    description: AgentKit command-line interface and command routing.
    code:
      - src/agentkit/cli.py
      - src/agentkit/__main__.py
      - pyproject.toml
    docs:
      - docs/components/cli/design.md
      - docs/components/cli/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - cli
      - command
      - argparse

  configuration:
    description: agentkit.yml schema and configuration parsing.
    code:
      - src/agentkit/config.py
      - agentkit.yml
      - tests/test_config.py
    docs:
      - docs/components/configuration/design.md
      - docs/components/configuration/schema.md
      - docs/components/configuration/testing.md
    required_docs:
      - design
      - schema
      - testing
    keywords:
      - config
      - schema
      - yaml

  guidance:
    description: Agent-facing orientation, intent guidance, docs-impact, and review guidance.
    code:
      - src/agentkit/commands.py
      - src/agentkit/render.py
      - src/agentkit/git.py
      - src/agentkit/fs.py
      - src/agentkit/lifecycle.py
      - src/agentkit/receipts.py
      - src/agentkit/task_state.py
      - src/agentkit/watch.py
      - tests/test_commands.py
    docs:
      - docs/components/guidance/design.md
      - docs/components/guidance/testing.md
      - docs/implementation-model.md
      - docs/review-guidance.md
    required_docs:
      - design
      - testing
    keywords:
      - orient
      - guidance
      - docs-impact
      - review

  docs:
    description: Product design, workflow, roadmap, and maintainability documentation.
    code:
      - docs/**
      - README.md
      - AGENTS.md
    docs:
      - docs/design.md
      - docs/workflow.md
      - docs/roadmap.md
      - docs/implementation-model.md
    required_docs:
      - design
    keywords:
      - docs
      - documentation
      - maintainability

  skill:
    description: Codex plugin packaging and bundled AgentKit skill for agents using the toolkit.
    code:
      - plugins/agentkit/**
      - .agents/plugins/marketplace.json
    docs:
      - docs/components/skill/design.md
      - docs/components/skill/testing.md
      - docs/design.md
      - docs/workflow.md
    required_docs:
      - design
      - testing
    keywords:
      - plugin
      - skill
      - marketplace
      - codex

  governance:
    description: Repository hygiene, package boundaries, and AgentKit's own dogfood baseline.
    code:
      - .gitignore
      - src/agentkit/__init__.py
    docs:
      - docs/components/governance/design.md
      - docs/components/governance/testing.md
    required_docs:
      - design
      - testing
    keywords:
      - governance
      - repository
      - git

layers:
  config:
    paths:
      - src/agentkit/config.py
    may_import: []
  utilities:
    paths:
      - src/agentkit/fs.py
      - src/agentkit/git.py
      - src/agentkit/render.py
      - src/agentkit/receipts.py
      - src/agentkit/task_state.py
    may_import:
      - config
  lifecycle:
    paths:
      - src/agentkit/lifecycle.py
      - src/agentkit/watch.py
    may_import:
      - utilities
  commands:
    paths:
      - src/agentkit/commands.py
    may_import:
      - config
      - utilities
      - lifecycle
  cli:
    paths:
      - src/agentkit/cli.py
      - src/agentkit/__main__.py
    may_import:
      - commands
      - lifecycle

review:
  require_for:
    - public_api
    - data_model
    - architecture
    - guidance
    - cli
  default: warn

skills:
  source: plugins/agentkit/skills/agentkit/SKILL.md
  output: plugins/agentkit/skills/agentkit/SKILL.md
